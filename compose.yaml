services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: webhook
      POSTGRES_PASSWORD: webhook
      POSTGRES_DB: webhook
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U webhook -d webhook"]
      interval: 2s
      timeout: 3s
      retries: 20
  api:
    build: .
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql://webhook:webhook@db:5432/webhook
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
  worker:
    build: .
    command: python worker.py
    environment:
      DATABASE_URL: postgresql://webhook:webhook@db:5432/webhook
      RECEIVER_URL: http://receiver:8001/receive
    depends_on:
      db:
        condition: service_healthy
  receiver:
    build: .
    command: uvicorn receiver:app --host 0.0.0.0 --port 8001
    ports:
      - "127.0.0.1:8001:8001"
volumes:
  pgdata:
